[project]
name = "claude-kit"
version = "0.3.1"
description = "Versioned Claude Code kit: plugin agents and hooks, applied per repo, benchmarked per version"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kit = "kit.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kit"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
